name: Build, Scan and Deploy — UniVulner Frontend

on:
  push:
    branches: [deploy]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1

jobs:
  build-scan-deploy:
    name: Build → Scan → Deploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────
      # Fetches full git history so Trufflehog can scan all commits
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Node setup ─────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # ── 3. Install dependencies ───────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. SAST — Dependency vulnerability scan ───────────────
      # retire.js checks all JavaScript libraries for known CVEs
      # Better than npm audit for frontend projects
      # Shows results without blocking deployment
      - name: SAST - dependency scan (retire.js)
        run: npx --yes retire --path . --outputformat text || true

      # ── 5. Secrets scan — Trufflehog ─────────────────────────
      # 100% free — no license, no signup required
      # Scans git history for real leaked secrets
      # API keys, passwords, tokens, AWS credentials
      # --only-verified means only real confirmed secrets fail the build
      # Not false positives — only actual exposed credentials
      - name: Secrets scan (Trufflehog)
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: HEAD~1
          head: HEAD
          extra_args: --only-verified

      # ── 6. Build frontend ─────────────────────────────────────
      # VITE_API_URL intentionally NOT set here
      # Browser calls same origin (your EC2 IP)
      # Nginx proxy.conf forwards to backend
      # Backend IP NEVER compiled into JavaScript bundle
      - name: Build frontend
        run: npm run build

      # ── 7. AWS credentials via OIDC ──────────────────────────
      # No AWS_ACCESS_KEY_ID stored anywhere in GitHub
      # GitHub sends a JWT token to AWS STS
      # AWS verifies it comes from RAW-02/Frontend repo only
      # Returns a 15-minute temporary credential
      # Expires automatically — cannot be stolen and reused
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ── 8. Upload build to private S3 ────────────────────────
      # dist/ folder synced to private encrypted S3 bucket
      # Users NEVER access S3 directly
      # Only EC2 pulls from S3 using its own IAM role
      # --delete removes old files so stale files never served
      # --sse AES256 encrypts files in transit to S3
      - name: Upload build to S3
        run: |
          aws s3 sync dist/ s3://${{ vars.S3_BUCKET }}/frontend/ \
            --delete \
            --sse AES256

      # ── 9. Deploy to EC2 via SSM ─────────────────────────────
      # No SSH. Port 22 is NOT open on EC2.
      # No credentials passed to EC2.
      # EC2 uses its own IAM role to pull from S3.
      # BACKEND_IP is a GitHub Secret — masked in ALL logs
      # Even if someone reads the logs they see ***
      # Backend IP written to Nginx proxy.conf on EC2
      # Never appears in JavaScript bundle users download
      - name: Deploy to EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --region ${{ env.AWS_REGION }} \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands='[
              "echo === Step 1: Syncing frontend files from S3 ===",
              "aws s3 sync s3://${{ vars.S3_BUCKET }}/frontend/ /var/www/frontend/ --delete --region ${{ env.AWS_REGION }}",
              "chown -R nginx:nginx /var/www/frontend/",
              "chmod -R 755 /var/www/frontend/",
              "echo === Step 2: Writing backend proxy config ===",
              "cat > /etc/nginx/conf.d/proxy.conf << PROXYEOF\nlocation /dashboard/ { proxy_pass http://${{ secrets.BACKEND_IP }}:8000/dashboard/; proxy_http_version 1.1; proxy_set_header Host \$host; proxy_set_header X-Real-IP \$remote_addr; proxy_connect_timeout 30s; proxy_read_timeout 60s; }\nlocation /search/ { proxy_pass http://${{ secrets.BACKEND_IP }}:8000/search/; proxy_http_version 1.1; proxy_set_header Host \$host; proxy_set_header X-Real-IP \$remote_addr; }\nlocation /api/ { proxy_pass http://${{ secrets.BACKEND_IP }}:8000/api/; proxy_http_version 1.1; proxy_set_header Host \$host; proxy_set_header X-Real-IP \$remote_addr; }\nlocation /cve/ { proxy_pass http://${{ secrets.BACKEND_IP }}:8000/cve/; proxy_http_version 1.1; proxy_set_header Host \$host; proxy_set_header X-Real-IP \$remote_addr; }\nlocation /export/ { proxy_pass http://${{ secrets.BACKEND_IP }}:8000/export/; proxy_http_version 1.1; proxy_set_header Host \$host; proxy_set_header X-Real-IP \$remote_addr; }\nPROXYEOF",
              "echo === Step 3: Validating and reloading Nginx ===",
              "nginx -t && systemctl reload nginx",
              "echo === Deployment complete ==="
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          # Poll until command finishes — max 3 minutes
          for i in {1..36}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
              --region ${{ env.AWS_REGION }} \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "[$i] Status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Deployment succeeded."
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "Deployment FAILED. Error output:"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
                --region ${{ env.AWS_REGION }} \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi
            sleep 5
          done

          echo "Timed out waiting for deployment."
          exit 1