name: Build, Scan and Deploy — UniVulner Frontend

on:
  push:
    branches: [deploy]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1

jobs:
  build-scan-deploy:
    name: Build → Scan → Deploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Node setup ─────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ── 3. Install ────────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. SAST — npm audit ───────────────────────────────────
      # Scans all npm packages for known vulnerabilities
      # continue-on-error so audit issues are visible but don't block
      - name: SAST - dependency scan
        run: npm audit --audit-level=high
        continue-on-error: true

      # ── 5. Secrets scan — Gitleaks ────────────────────────────
      # Scans every committed file for passwords, tokens, API keys
      # Fails pipeline if any secret found before reaching AWS
      - name: Secrets scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 6. Build ──────────────────────────────────────────────
      # VITE_API_URL is intentionally empty in production
      # Browser calls same origin — Nginx proxies to backend
      # Backend IP never compiled into JavaScript bundle
      - name: Build frontend
        run: npm run build

      # ── 7. AWS credentials via OIDC ───────────────────────────
      # No AWS keys stored anywhere in GitHub
      # GitHub gets 15-minute token from AWS STS
      # Only RAW-02/Frontend repo can request this token
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ── 8. Upload build to S3 ─────────────────────────────────
      # Private bucket — users never access S3 directly
      # EC2 pulls from S3 using its own IAM role
      - name: Upload build to S3
        run: |
          aws s3 sync dist/ s3://${{ vars.S3_BUCKET }}/frontend/ \
            --delete \
            --sse AES256

      # ── 9. Deploy to EC2 via SSM ──────────────────────────────
      # No SSH. No port 22. No credentials passed to EC2.
      # BACKEND_IP is a GitHub Secret — masked in all logs
      # Nginx proxy.conf written on EC2 — IP never in JS bundle
      - name: Deploy to EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --region ${{ env.AWS_REGION }} \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters commands='[
              "echo === Syncing frontend files ===",
              "aws s3 sync s3://${{ vars.S3_BUCKET }}/frontend/ /var/www/frontend/ --delete --region ${{ env.AWS_REGION }}",
              "chown -R nginx:nginx /var/www/frontend/",
              "chmod -R 755 /var/www/frontend/",
              "echo === Writing backend proxy config ===",
              "cat > /etc/nginx/conf.d/proxy.conf << PROXYEOF\nlocation /dashboard/ { proxy_pass http://${{ secrets.BACKEND_IP }}:8000/dashboard/; proxy_http_version 1.1; proxy_set_header Host \$host; proxy_set_header X-Real-IP \$remote_addr; proxy_connect_timeout 30s; proxy_read_timeout 60s; }\nlocation /search/ { proxy_pass http://${{ secrets.BACKEND_IP }}:8000/search/; proxy_http_version 1.1; proxy_set_header Host \$host; proxy_set_header X-Real-IP \$remote_addr; }\nlocation /api/ { proxy_pass http://${{ secrets.BACKEND_IP }}:8000/api/; proxy_http_version 1.1; proxy_set_header Host \$host; proxy_set_header X-Real-IP \$remote_addr; }\nlocation /cve/ { proxy_pass http://${{ secrets.BACKEND_IP }}:8000/cve/; proxy_http_version 1.1; proxy_set_header Host \$host; proxy_set_header X-Real-IP \$remote_addr; }\nlocation /export/ { proxy_pass http://${{ secrets.BACKEND_IP }}:8000/export/; proxy_http_version 1.1; proxy_set_header Host \$host; proxy_set_header X-Real-IP \$remote_addr; }\nPROXYEOF",
              "nginx -t && systemctl reload nginx",
              "echo === Deployment complete ==="
            ]' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in {1..36}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
              --region ${{ env.AWS_REGION }} \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "[$i] Status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Deployment succeeded."
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "Deployment FAILED."
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
                --region ${{ env.AWS_REGION }} \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi
            sleep 5
          done

          echo "Timed out."
          exit 1