name: Build, Scan and Deploy — UniVulner Frontend

on:
  push:
    branches: [deploy]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1

jobs:
  build-scan-deploy:
    name: Build → Scan → Deploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ───────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Node setup ─────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # ── 3. Install dependencies ───────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. SAST — dependency scan ─────────────────────────────
      - name: SAST - dependency scan
        run: npx --yes retire --path . --outputformat text || true

      # ── 5. Secrets scan — Trufflehog ─────────────────────────
      - name: Secrets scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: HEAD~1
          head: HEAD
          extra_args: --only-verified

      # ── 6. Build frontend ─────────────────────────────────────
      - name: Build frontend
        run: npm run build

      # ── 7. AWS credentials via OIDC ───────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # ── 8. Upload build to S3 ─────────────────────────────────
      - name: Upload frontend build to S3
        run: |
          aws s3 sync dist/ s3://${{ vars.S3_BUCKET }}/frontend/ \
            --delete \
            --sse AES256

      # ── 9. Create proxy.conf and upload to S3 ─────────────────
      # WHY S3 approach:
      # Writing proxy.conf inline via SSM heredoc breaks because
      # JSON does not support real newlines — \n becomes literal text.
      # Solution: create real file in GitHub Actions → upload to S3
      # → EC2 downloads clean file. No escaping issues. Secure.
      # BACKEND_IP is a GitHub Secret — masked in all logs as ***
      - name: Create and upload proxy config to S3
        run: |
          cat > proxy.conf << 'EOF'
          location /dashboard/ {
              proxy_pass http://${{ secrets.BACKEND_IP }}:8000/dashboard/;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_connect_timeout 30s;
              proxy_read_timeout 60s;
          }
          location /search/ {
              proxy_pass http://${{ secrets.BACKEND_IP }}:8000/search/;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          }
          location /api/ {
              proxy_pass http://${{ secrets.BACKEND_IP }}:8000/api/;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          }
          location /cve/ {
              proxy_pass http://${{ secrets.BACKEND_IP }}:8000/cve/;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          }
          location /export/ {
              proxy_pass http://${{ secrets.BACKEND_IP }}:8000/export/;
              proxy_http_version 1.1;
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          }
          EOF

          aws s3 cp proxy.conf \
            s3://${{ vars.S3_BUCKET }}/config/proxy.conf \
            --sse AES256

          # Remove local file immediately — do not leave it in runner
          rm -f proxy.conf

      # ── 10. Deploy — EC2 pulls everything from S3 ─────────────
      # WHY this approach is secure:
      # 1. No SSH — port 22 is closed on EC2
      # 2. No credentials passed to EC2
      # 3. EC2 uses its own IAM role to pull from S3
      # 4. Backend IP never appears in EC2 command — comes from S3 file
      # 5. SSM command is simple — no heredoc, no escaping issues
      - name: Deploy to EC2 via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --region ${{ env.AWS_REGION }} \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters '{"commands":[
              "echo === Step 1: Sync frontend files ===",
              "aws s3 sync s3://${{ vars.S3_BUCKET }}/frontend/ /var/www/frontend/ --delete --region ${{ env.AWS_REGION }}",
              "chown -R nginx:nginx /var/www/frontend/",
              "chmod -R 755 /var/www/frontend/",
              "echo === Step 2: Download proxy config ===",
              "aws s3 cp s3://${{ vars.S3_BUCKET }}/config/proxy.conf /etc/nginx/conf.d/proxy.conf --region ${{ env.AWS_REGION }}",
              "echo === Step 3: Test and reload Nginx ===",
              "nginx -t",
              "systemctl reload nginx",
              "echo === Deployment complete ==="
            ]}' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          sleep 10

          for i in {1..36}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
              --region ${{ env.AWS_REGION }} \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "[$i] Status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Deployment succeeded."
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "Deployment FAILED:"
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
                --region ${{ env.AWS_REGION }} \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi
            sleep 5
          done

          echo "Timed out."
          exit 1