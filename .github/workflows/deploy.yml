name: Build, Scan and Deploy — UniVulner Frontend

on:
  push:
    branches: [deploy]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: frontend-deploy
  cancel-in-progress: true

env:
  AWS_REGION: ap-south-1

jobs:
  build-scan-deploy:
    name: Build → Scan → Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: SAST - retire.js
        run: npx --yes retire --path . --outputformat text

      - name: SAST - npm audit
        run: npm audit --audit-level=high

      - name: Secrets scan
        uses: trufflesecurity/trufflehog@v3.88.1
        with:
          path: ./
          extra_args: --only-verified

      - name: Build frontend
        run: npm run build

      - name: Verify build output
        run: |
          test -d dist
          test -f dist/index.html
          ls -lah dist/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-duration-seconds: 900

      - name: Upload frontend build to S3
        run: |
          aws s3 sync dist/ s3://${{ vars.S3_BUCKET }}/frontend/ \
            --delete \
            --sse AES256

      - name: Create and upload Nginx config
        env:
          BACKEND_IP: ${{ secrets.BACKEND_IP }}
        run: |
          python3 - <<'PYEOF'
import os
import re
import textwrap

backend_ip = os.environ["BACKEND_IP"].strip()

if not re.fullmatch(r"[A-Za-z0-9.\-]+", backend_ip):
    raise ValueError("Invalid BACKEND_IP format")

content = f"""
server {{
    listen 80;
    server_name _;

    root /var/www/frontend;
    index index.html;

    location / {{
        try_files $uri $uri/ /index.html;
    }}

    location /dashboard/ {{
        proxy_pass http://{backend_ip}:8000/dashboard/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_read_timeout 60s;
    }}

    location /search/ {{
        proxy_pass http://{backend_ip}:8000/search/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }}

    location /api/ {{
        proxy_pass http://{backend_ip}:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }}

    location /cve/ {{
        proxy_pass http://{backend_ip}:8000/cve/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }}

    location /export/ {{
        proxy_pass http://{backend_ip}:8000/export/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }}

    location ~ /\\. {{
        deny all;
    }}
}}
"""

with open("univulner-frontend.conf", "w", encoding="utf-8") as f:
    f.write(textwrap.dedent(content).lstrip())
PYEOF

          aws s3 cp univulner-frontend.conf \
            s3://${{ vars.S3_BUCKET }}/config/univulner-frontend.conf \
            --sse AES256

          rm -f univulner-frontend.conf

      - name: Deploy to EC2 via SSM
        run: |
          cat > ssm-params.json <<'JSON'
          {
            "commands": [
              "set -e",
              "aws s3 sync s3://${{ vars.S3_BUCKET }}/frontend/ /var/www/frontend/ --delete --region ${{ env.AWS_REGION }}",
              "NGINX_USER=$(ps -eo user,comm | awk '$2==\"nginx\"{print $1; exit}')",
              "if ! id \"$NGINX_USER\" >/dev/null 2>&1; then if id nginx >/dev/null 2>&1; then NGINX_USER=nginx; elif id www-data >/dev/null 2>&1; then NGINX_USER=www-data; else NGINX_USER=root; fi; fi",
              "chown -R $NGINX_USER:$NGINX_USER /var/www/frontend/",
              "chmod -R 755 /var/www/frontend/",
              "aws s3 cp s3://${{ vars.S3_BUCKET }}/config/univulner-frontend.conf /etc/nginx/conf.d/univulner-frontend.conf --region ${{ env.AWS_REGION }}",
              "rm -f /etc/nginx/conf.d/proxy.conf",
              "if [ -f /etc/nginx/conf.d/default.conf ]; then mv /etc/nginx/conf.d/default.conf /etc/nginx/conf.d/default.conf.disabled; fi",
              "if [ -f /etc/nginx/sites-enabled/default ]; then rm -f /etc/nginx/sites-enabled/default; fi",
              "nginx -t",
              "systemctl reload nginx"
            ]
          }
          JSON

          COMMAND_ID=$(aws ssm send-command \
            --region ${{ env.AWS_REGION }} \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters file://ssm-params.json \
            --query "Command.CommandId" \
            --output text)

          for i in {1..36}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
              --region ${{ env.AWS_REGION }} \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "[$i] Status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ] || [ "$STATUS" = "TimedOut" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
                --region ${{ env.AWS_REGION }} \
                --query "StandardErrorContent" \
                --output text
              exit 1
            fi

            sleep 5
          done

          exit 1